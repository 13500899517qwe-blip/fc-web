<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6a00"/>
      <stop offset="100%" stop-color="#cc5500"/>
    </linearGradient>
  </defs>

  <!-- Shield body (subtle bg) -->
  <path d="M20 8 L72 8 L88 28 L88 60 C88 82 50 96 50 96 C50 96 12 82 12 60 L12 28 Z"
        fill="url(#brandGrad)" opacity="0.08"/>

  <!-- Shield outline -->
  <path d="M24 14 L66 14 L80 30 L80 58 C80 78 50 90 50 90 C50 90 20 78 20 58 L20 30 Z"
        fill="white" stroke="#ff6a00" stroke-width="1.5"/>

  <!-- Gear with car -->
  <g transform="translate(50, 48)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="24" fill="none" stroke="#ff6a00" stroke-width="2.5"/>
    <!-- Inner ring -->
    <circle cx="0" cy="0" r="14" fill="none" stroke="#ff6a00" stroke-width="1.8"/>
    <!-- Gear teeth (8 notches) -->
    <rect x="-2.5" y="-30" width="5" height="10" rx="1.5" fill="#ff6a00"/>
    <rect x="-2.5" y="20" width="5" height="10" rx="1.5" fill="#ff6a00"/>
    <rect x="-30" y="-2.5" width="10" height="5" rx="1.5" fill="#ff6a00"/>
    <rect x="20" y="-2.5" width="10" height="5" rx="1.5" fill="#ff6a00"/>
    <!-- Diagonal teeth -->
    <g transform="rotate(45)">
      <rect x="-2.5" y="-30" width="5" height="8" rx="1" fill="#ff6a00" opacity="0.6"/>
      <rect x="-2.5" y="22" width="5" height="8" rx="1" fill="#ff6a00" opacity="0.6"/>
      <rect x="-30" y="-2.5" width="8" height="5" rx="1" fill="#ff6a00" opacity="0.6"/>
      <rect x="22" y="-2.5" width="8" height="5" rx="1" fill="#ff6a00" opacity="0.6"/>
    </g>
    <!-- Car silhouette -->
    <path d="M-9 7 L-12 0 L-6 -8 L5 -8 L12 0 L10 7 Z" fill="#ff6a00" opacity="0.85"/>
    <circle cx="-4" cy="7" r="3.5" fill="#ff6a00"/>
    <circle cx="5" cy="7" r="3.5" fill="#ff6a00"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="2.5" fill="#ff6a00"/>
  </g>
</svg>
