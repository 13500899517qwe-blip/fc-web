<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6a00"/>
      <stop offset="100%" stop-color="#cc5500"/>
    </linearGradient>
  </defs>

  <!-- Shield icon -->
  <g transform="translate(0, 10)">
    <!-- Shield body -->
    <path d="M35 2 L60 2 L72 18 L72 48 C72 68 47.5 82 47.5 82 C47.5 82 23 68 23 48 L23 18 Z"
          fill="url(#brandGrad)" opacity="0.12"/>
    <path d="M35 6 L57 6 L68 20 L68 46 C68 64 47.5 77 47.5 77 C47.5 77 27 64 27 46 L27 20 Z"
          fill="white" stroke="#ff6a00" stroke-width="1.5"/>
    <!-- Gear/stylized G within shield -->
    <g transform="translate(47.5, 42)">
      <!-- Outer ring -->
      <circle cx="0" cy="0" r="18" fill="none" stroke="#ff6a00" stroke-width="2"/>
      <!-- Inner ring -->
      <circle cx="0" cy="0" r="10" fill="none" stroke="#ff6a00" stroke-width="1.5"/>
      <!-- Gear teeth (4 notches) -->
      <rect x="-2.5" y="-22" width="5" height="8" rx="1" fill="#ff6a00"/>
      <rect x="-2.5" y="14" width="5" height="8" rx="1" fill="#ff6a00"/>
      <rect x="-22" y="-2.5" width="8" height="5" rx="1" fill="#ff6a00"/>
      <rect x="14" y="-2.5" width="8" height="5" rx="1" fill="#ff6a00"/>
      <!-- Car silhouette inside -->
      <path d="M-7 5 L-9 1 L-5 -5 L4 -5 L8 1 L6 5 Z" fill="#ff6a00" opacity="0.8"/>
      <circle cx="-3" cy="5" r="2.5" fill="#ff6a00"/>
      <circle cx="4" cy="5" r="2.5" fill="#ff6a00"/>
      <!-- Center dot -->
      <circle cx="0" cy="0" r="2" fill="#ff6a00"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(85, 22)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0f172a" letter-spacing="1">
      FENGCHENG
    </text>
    <text x="0" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#ff6a00" letter-spacing="2.5">
      AUTO PARTS
    </text>
    <text x="0" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#64748b" letter-spacing="1.5">
      CUSTOM MANUFACTURER · IATF16949
    </text>
  </g>
</svg>
